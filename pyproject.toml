[project]
name = "agent-skills-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
# Root on sys.path so tests import `shared.*`. Hook tests shell out per case and run in
# parallel: 189s -> 39s for test_bash_dispatch.py; loadfile keeps a file's tests on one worker.
pythonpath = ["."]
addopts = "-n auto --dist loadfile"
